<footer *ngIf="!isAsesorPage && !isLoginPage" class="bg-gray-900 text-gray-400 py-8 mt-auto border-t border-gray-800">
  <div class="container mx-auto px-6">
    <div class="flex flex-col md:flex-row justify-between items-center">
      
      <div class="mb-4 md:mb-0 text-center md:text-left">
        <p class="text-sm">© 2026 Todos los derechos reservados.</p>
      </div>
      
      <div class="flex flex-col items-center md:items-end space-y-2">
        <!-- Estado normal sin pendientes -->
        <div *ngIf="syncStatus.total === 0" class="flex items-center space-x-2 bg-gray-800 px-3 py-1 rounded-full border border-gray-700">
          <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
          <span class="text-xs font-medium text-gray-300 tracking-wider uppercase">Sincronizado / Offline Listo</span>
        </div>

        <!-- Con pendientes por sincronizar -->
        <div *ngIf="syncStatus.pending > 0" class="flex items-center space-x-2 bg-amber-950/80 px-3 py-1 rounded-full border border-amber-700">
          <span class="w-2 h-2 bg-amber-400 rounded-full animate-ping"></span>
          <span class="text-xs font-semibold text-amber-200 tracking-wider uppercase">{{ syncStatus.pending }} pendiente(s) por subir</span>
        </div>

        <!-- Con errores en cola -->
        <div *ngIf="syncStatus.failed > 0" class="flex items-center space-x-2 bg-red-950/80 px-3 py-1 rounded-full border border-red-700 cursor-pointer hover:bg-red-900 transition-colors" (click)="reintentar()" title="Clic para reintentar">
          <span class="w-2 h-2 bg-red-400 rounded-full"></span>
          <span class="text-xs font-semibold text-red-200 tracking-wider uppercase">{{ syncStatus.failed }} con error (Clic reintentar)</span>
        </div>

        <p class="text-[10px] text-gray-500 italic">Sincronización Automática Habilitada</p>
      </div>

    </div>
  </div>
</footer>
