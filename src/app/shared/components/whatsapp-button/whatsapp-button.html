<!-- Backdrop para cerrar al hacer clic afuera en móviles -->
<div *ngIf="isOpen" (click)="closeModal()"
  class="fixed inset-0 z-[60] bg-black/30 backdrop-blur-[2px] transition-opacity duration-200">
</div>

<!-- Ventana emergente compacta de mensaje -->
<div *ngIf="isOpen"
  class="fixed bottom-40 sm:bottom-44 right-4 md:bottom-24 md:right-6 z-[70] w-[calc(100vw-2rem)] max-w-[320px] bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden transform transition-all duration-200 animate-in fade-in zoom-in-95">

  <!-- Encabezado -->
  <div class="bg-gradient-to-r from-blue-800 to-blue-600 px-4 py-3 text-white flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
      <div class="relative">
        <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
          <svg class="w-5 h-5 text-white fill-current" viewBox="0 0 24 24">
            <path
              d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z" />
          </svg>
        </div>
        <span
          class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-300 border-2 border-emerald-600 rounded-full"></span>
      </div>
      <div>
        <h4 class="text-xs font-bold text-white tracking-wide">Soporte vía WhatsApp</h4>
        <p class="text-[10px] text-emerald-50 font-medium">{{ displayPhone }}</p>
      </div>
    </div>

    <button (click)="closeModal()"
      class="text-white/80 hover:text-white p-1 rounded-full hover:bg-white/10 transition-colors focus:outline-none"
      title="Cerrar">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Cuerpo -->
  <div class="p-3.5 space-y-2.5 bg-slate-50/50">
    <div class="relative">
      <textarea #msgInput [(ngModel)]="message" (keydown)="onKeyDown($event)" rows="3"
        placeholder="Escribe tu mensaje aquí..."
        class="w-full text-xs p-2.5 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-slate-800 placeholder-slate-400 resize-none transition shadow-sm"></textarea>
    </div>

    <!-- Botones de plantilla y enviar -->
<div class="flex items-center justify-center gap-2">

  <!-- Falla -->
  <button 
    type="button" 
    (click)="setQuickMessage('Hola, necesito apoyo, la aplicación está presentando fallas.')"
    class="text-[10px] bg-slate-200/70 hover:bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full transition">
    Falla
  </button>

  <!-- Botón Enviar -->
  <button 
    type="button" 
    (click)="sendMessage()"
    class="w-9 h-9 bg-white hover:bg-green-50 active:scale-[0.95] text-[#25D366] rounded-full flex items-center justify-center shadow-md shadow-emerald-200/40 transition-all">

    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
      <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
    </svg>

  </button>

  <!-- Duda -->
  <button 
    type="button" 
    (click)="setQuickMessage('Hola, tengo una duda.')"
    class="text-[10px] bg-slate-200/70 hover:bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full transition">
    Duda
  </button>

</div>

      <button type="button" (click)="sendMessage()"

        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
        </svg>

      </button>
    </div> -->
  </div>
</div>

<!-- Botón Flotante Pequeño (FAB) -->
<button (click)="toggleModal()" [class.scale-95]="isOpen" aria-label="Reportar falla o duda"
  title="Enviar WhatsApp al 4181481083"
  class="fixed bottom-28 right-4 md:bottom-8 md:right-6 z-[60] w-11 h-11 bg-[#25D366] hover:bg-[#20ba5a] text-white rounded-full flex items-center justify-center shadow-lg shadow-emerald-900/20 active:scale-90 hover:scale-105 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:ring-offset-2">

  <div class="relative flex items-center justify-center">
    <!-- Icono WhatsApp -->
    <svg *ngIf="!isOpen" class="w-6 h-6 fill-current text-white" viewBox="0 0 24 24">
      <path
        d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z" />
    </svg>

    <!-- Icono X cuando está abierto -->
    <svg *ngIf="isOpen" class="w-5 h-5 text-white stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
    </svg>

    <!-- Indicador de notificación / soporte disponible -->
    <!-- <span *ngIf="!isOpen" class="absolute -top-1 -right-1 flex h-3 w-3">

      <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-300 border border-white"></span>
    </span> -->
  </div>
</button>
